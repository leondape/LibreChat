version: '3.4'

services:
# LOCAL BUILD
  api:
    image: ${COMMIT_TAG} # change version to the latest
    ports:
      - "3080:3080"
    container_name: wangpt
    command: sh -c "npm run backend"
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - MEM_DIAG=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:3080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - type: bind
        source: ./api/data/auth.json
        target: /app/api/data/auth.json
  meilisearch:
    environment:
      - MEILI_MAX_INDEXING_MEMORY=4GiB
      - MEILI_MAX_INDEXING_THREADS=2
    mem_limit: 12g
    memswap_limit: 12g
  mongodb:
    command: mongod --noauth --wiredTigerCacheSizeGB 4
