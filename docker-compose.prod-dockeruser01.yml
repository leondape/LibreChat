version: '3.4'

services:
# LOCAL BUILD
  api:
    image: ${COMMIT_TAG} # change version to the latest
    ports:
      - "3080:3080"
    container_name: wangpt
    command: sh -c "npm run backend"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - type: bind
        source: ./api/data/auth.json
        target: /app/api/data/auth.json

  metrics:
    container_name: wangpt_metrics
    image: registry.leoninestudios.com/l9ai/chat-services/librechat_exporter:latest
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    restart: unless-stopped

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
