version: '3.4'

services:
# LOCAL BUILD
  api:
    image: ${COMMIT_TAG} # change version to the latest
    ports:
      - "3081:3080"
    container_name: wangpt_dockeruser01
    command: sh -c "npm run backend"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - type: bind
        source: ./api/data/auth.json
        target: /app/api/data/auth.json
      
  mongodb:
    container_name: wangpt_dockeruser01_mongodb

  meilisearch:
    container_name: wangpt_dockeruser01_meilisearch

  vectordb:
    container_name: wangpt_dockeruser01_vectordb

  rag_api:
    container_name: wangpt_dockeruser01_rag_api

  metrics:
    container_name: wangpt_dockeruser01_metrics
    image: registry.leoninestudios.com/l9ai/chat-services/librechat_exporter:latest
    depends_on:
      - mongodb
    ports:
      - "8001:8000"
    restart: unless-stopped
