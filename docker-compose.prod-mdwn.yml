version: '3.4'

services:
# LOCAL BUILD
  api:
    image: ${COMMIT_TAG} # change version to the latest
    ports:
      - "3080:3080"
    container_name: wangpt
    command: sh -c "npm run backend"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - type: bind
        source: ./api/data/auth.json
        target: /app/api/data/auth.json
    networks:
      - default
      - mcp-shared-network
      
  metrics:
    image: registry.leoninestudios.com/l9ai/chat-services/librechat_exporter:latest
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    restart: unless-stopped

    networks:
      - default
      
networks:
  mcp-shared-network:
    external: true  # Connect to MCP services
