workflow:
  name: '$PIPELINE_NAME'
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SECURITY_SCAN == "nightly"
      variables:
        PIPELINE_NAME: "Security scan warning"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
      variables:
        PIPELINE_NAME: "$CI_COMMIT_REF_NAME"

image: docker:latest

stages:
  - build
  - scan
  - deploy
  - de-provisioning

variables:
  COMMIT_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  DEPLOY_SERVER_MDWN: $CI_DEPLOY_SERVER_MDWN
  DEPLOY_USER_DOCKERUSER01: $CI_DEPLOY_USER_DOCKERUSER01
  DEPLOY_DIR_PROD_DOCKERUSER01: /data/docker/dockeruser01/deployments/wangpt
  DEPLOY_DIR_STAGING_DOCKERUSER01: /data/docker/dockeruser01/deployments/wangpt-staging
  DEPLOY_SSH_PORT: "35039"
  CI_VERBOSE: "true"

before_script:
  - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

build:
  stage: build
  script:
    - docker build -t $IMAGE_TAG -f Dockerfile .
    - docker tag $IMAGE_TAG $COMMIT_TAG
    - docker push $IMAGE_TAG
    - docker push $COMMIT_TAG
  tags:
    - runner-01
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

deploy-prod-dockeruser01:
  stage: deploy
  needs:
    - "Security scan warning"
  environment:
    name: production
  tags:
    - runner-01
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_DOCKERUSER01" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "$DEPLOY_SSH_PORT" $DEPLOY_SERVER_MDWN >> ~/.ssh/known_hosts

    - export COMMIT_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"

    - scp -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no docker-compose.yml $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN:$DEPLOY_DIR_PROD_DOCKERUSER01/docker-compose.yml
    - scp -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no docker-compose.prod-dockeruser01.yml $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN:$DEPLOY_DIR_PROD_DOCKERUSER01/docker-compose.prod-dockeruser01.yml
    - |
      ssh -p "$DEPLOY_SSH_PORT" $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN /bin/bash << EOF
      export COMMIT_TAG=$COMMIT_TAG
      eval DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock
      export DOCKER_HOST
      echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
      cd $DEPLOY_DIR_PROD_DOCKERUSER01
      docker compose -f docker-compose.yml -f docker-compose.prod-dockeruser01.yml pull
      docker compose -f docker-compose.yml -f docker-compose.prod-dockeruser01.yml down || true
      docker compose -f docker-compose.yml -f docker-compose.prod-dockeruser01.yml up -d
      EOF

deploy-staging-dockeruser01:
  stage: deploy
  needs:
    - "Security scan warning"
  tags:
    - runner-01
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "staging"
  environment:
    name: staging

  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_DOCKERUSER01" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SERVER_MDWN" >> ~/.ssh/known_hosts 2>/dev/null || true

    - export COMMIT_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"

    - test -n "$DEPLOY_SERVER_MDWN" && test -n "$DEPLOY_USER_DOCKERUSER01"
    - scp -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no docker-compose.yml $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN:$DEPLOY_DIR_STAGING_DOCKERUSER01/docker-compose.yml
    - scp -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no docker-compose.staging-dockeruser01.yml $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN:$DEPLOY_DIR_STAGING_DOCKERUSER01/docker-compose.staging-dockeruser01.yml
    - |
      ssh -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN /bin/bash << EOF
      export COMMIT_TAG=$COMMIT_TAG
      eval DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock
      export DOCKER_HOST
      echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
      cd $DEPLOY_DIR_STAGING_DOCKERUSER01
      docker compose -f docker-compose.yml -f docker-compose.staging-dockeruser01.yml pull
      docker compose -f docker-compose.yml -f docker-compose.staging-dockeruser01.yml down || true
      docker compose -f docker-compose.yml -f docker-compose.staging-dockeruser01.yml up -d
      EOF

delete-user-and-data:
  stage: de-provisioning
  tags:
    - runner-01
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "trigger" && $USER_EMAIL && $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_STRATEGY: none
  before_script: []
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_DOCKERUSER01" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "$DEPLOY_SSH_PORT" $DEPLOY_SERVER_MDWN >> ~/.ssh/known_hosts
    - echo "Deleting user $USER_EMAIL $(date -Iseconds)"
    - |
      ssh -p "$DEPLOY_SSH_PORT" $DEPLOY_USER_DOCKERUSER01@$DEPLOY_SERVER_MDWN /bin/bash << EOF
      eval DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock
      export DOCKER_HOST
      docker exec wangpt npm run delete-user -- -y -y $USER_EMAIL
      EOF

"Security scan warning":
  stage: scan
  tags:
    - runner-01
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - job: build
      optional: true
  before_script: []
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivycache
    TRIVY_TIMEOUT: 30m
    TRIVY_NO_PROGRESS: "true"
    TRIVY_DISABLE_VEX_NOTICE: "true"
    COMPOSE_FILE: docker-compose.yml
  cache:
    key: trivy-db
    when: always
    paths:
      - .trivycache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SECURITY_SCAN == "nightly"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
  script:
    - |
      set -eu
      mkdir -p trivy-reports
      echo "$CI_REGISTRY_PASSWORD" | trivy registry login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      if [ "${CI_PIPELINE_SOURCE}" = "schedule" ] || { [ "${CI_COMMIT_BRANCH:-}" != "main" ] && [ "${CI_COMMIT_BRANCH:-}" != "master" ] && [ "${CI_COMMIT_BRANCH:-}" != "staging" ]; }; then
        echo "Resolving the last successful production deployment"
        json=$(wget -qO- --header="JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/deployments?environment=production&status=success&order_by=finished_at&sort=desc&per_page=1" || true)
        sha=$(printf '%s' "$json" | sed -n 's/.*"sha":"\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)
        ref=$(printf '%s' "$json" | sed -n 's/.*"ref":"\([^"]*\)".*/\1/p' | head -n 1)
        if [ -n "$sha" ] && [ -n "$ref" ]; then
          short=$(printf '%s' "$sha" | cut -c1-8)
          IMAGE="${CI_REGISTRY_IMAGE}:${ref}-${short}"
          echo "Scanning deployed image ${IMAGE}"
        else
          IMAGE="${CI_REGISTRY_IMAGE}:${CI_DEFAULT_BRANCH}"
          echo "Could not read the last successful deployment. Scanning ${IMAGE} instead."
        fi
      else
        IMAGE="${COMMIT_TAG}"
        echo "Scanning image just built ${IMAGE}"
      fi
      pinned=$(sed -n 's/^[[:space:]]*image:[[:space:]]*//p' "$COMPOSE_FILE" | tr -d '"' | tr -d "'" | grep -v '\$' | grep -v 'librechat-dev:latest' | sort -u || true)
      images="$IMAGE $pinned"
      IGNORE_ARGS=""
      if [ -f "$CI_PROJECT_DIR/.trivyignore.yaml" ]; then
        IGNORE_ARGS="--ignorefile $CI_PROJECT_DIR/.trivyignore.yaml"
      fi
      failed=0
      html_parts=""
      for IMG in $images; do
        echo "Scanning ${IMG}"
        safe=$(printf '%s' "$IMG" | tr '/:' '__')
        trivy image --quiet --exit-code 0 --format template --template "@/contrib/html.tpl" --output "trivy-reports/${safe}.html" "$IMG"
        trivy image --quiet --exit-code 0 --format json --output "trivy-reports/${safe}.json" "$IMG"
        if ! trivy image --quiet --table-mode detailed --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $IGNORE_ARGS "$IMG"; then
          echo "FAIL ${IMG}: fixable HIGH or CRITICAL" >&2
          failed=1
        else
          echo "OK ${IMG}: no fixable HIGH or CRITICAL"
        fi
        html_parts="${html_parts} trivy-reports/${safe}.html"
      done
      cat $html_parts > trivy-reports/combined.html
      sed -i \
        -e 's/white-space: nowrap;/white-space: normal; overflow-wrap: anywhere; word-break: break-word;/' \
        -e 's|</head>|<style>@page{size:A3 landscape;margin:8mm}table{width:100%}td.links a{display:block !important;word-break:break-all !important}a.toggle-more-links{display:none !important}</style></head>|' \
        trivy-reports/combined.html
      apk add --no-cache --quiet chromium jq
      if ! chromium --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --no-pdf-header-footer \
        --print-to-pdf="${CI_PROJECT_DIR}/security-scan-warning.pdf" "file://${CI_PROJECT_DIR}/trivy-reports/combined.html" \
        2>trivy-reports/chromium.log; then
        echo "Chromium PDF render failed:" >&2
        cat trivy-reports/chromium.log >&2
        exit 1
      fi
      jq -s '.' trivy-reports/*.json > "${CI_PROJECT_DIR}/security-scan-report.json"
      if ! trivy image --quiet --exit-code 0 --severity HIGH,CRITICAL --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$IMAGE"; then
        echo "GitLab container-scanning report was not produced. The PDF report is still saved."
        rm -f gl-container-scanning-report.json
      fi
      rm -rf trivy-reports
      exit "$failed"
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - security-scan-warning.pdf
      - security-scan-report.json
    reports:
      container_scanning: gl-container-scanning-report.json
